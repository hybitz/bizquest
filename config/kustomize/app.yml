apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizquest-app
  labels:
    app: bizquest-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bizquest-app
  template:
    metadata:
      labels:
        app: bizquest-app
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bizquest
        image: bizquest/app:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: PORT
          value: '3000'
        command: ['bizquest']
